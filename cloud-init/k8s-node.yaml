#cloud-config
# Node prep for a kubeadm Kubernetes node (Ubuntu 24.04, arm64).
# Performs every step of README "Step 1 — Prepare every node" automatically.
# Usage:
#   multipass launch 24.04 --name cp-1 --cpus 2 --memory 3G --disk 20G \
#     --cloud-init cloud-init/k8s-node.yaml

package_update: true
package_upgrade: false

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gpg
  - containerd

write_files:
  # Kernel modules required by the container runtime and kube-proxy
  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

  # Bridged traffic must traverse iptables, and the node must forward packets
  - path: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

runcmd:
  # --- swap off (kubelet refuses to start otherwise); fstab edit makes it survive reboot
  - swapoff -a
  - sed -i '/ swap / s/^/#/' /etc/fstab

  # --- kernel modules + sysctl, applied now rather than at next boot
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system

  # --- containerd with the systemd cgroup driver.
  # SystemdCgroup=true is mandatory on Ubuntu 24.04; a mismatch with the kubelet
  # makes pods start and then die under memory pressure with no clear error.
  - mkdir -p /etc/containerd
  - bash -c 'containerd config default > /etc/containerd/config.toml'
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
  - systemctl restart containerd
  - systemctl enable containerd

  # --- Kubernetes apt repo (version-pinned: no "latest" channel exists)
  - mkdir -p /etc/apt/keyrings
  - bash -c 'curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg'
  - bash -c "echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /' > /etc/apt/sources.list.d/kubernetes.list"
  - apt-get update
  - apt-get install -y kubelet kubeadm kubectl

  # --- hold: Kubernetes supports upgrading only ONE minor version at a time,
  # so an unattended apt upgrade skipping a version would break the cluster.
  - apt-mark hold kubelet kubeadm kubectl

  - touch /var/lib/cloud/k8s-node-prep-complete

final_message: "k8s node prep complete after $UPTIME seconds"
