# Lightweight cluster for day-to-day work: 1 control plane + 2 workers.
#
#   kind create cluster --config kind/dev-cluster.yaml
#
# Two workers is the minimum that keeps multi-node behaviour meaningful —
# topologySpreadConstraints, pod anti-affinity, and PodDisruptionBudgets all
# need somewhere to spread to. A single-node cluster silently ignores them.
#
# With one control plane, kind does NOT create a load-balancer container,
# so this is 3 containers instead of the HA setup's 6.
#
# For the full 3-control-plane HA topology, use kind/ha-cluster.yaml instead.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: irshadproject

networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"

nodes:
  - role: control-plane
    # Expose ports for ingress experiments later, so the cluster doesn't need
    # recreating to reach a Service from macOS.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
  - role: worker
  - role: worker
